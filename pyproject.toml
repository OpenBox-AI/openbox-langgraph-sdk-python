[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openbox-langgraph-sdk-python"
version = "0.3.0"
description = "OpenBox governance and observability SDK for LangGraph"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "openbox-sdk-python>=0.1.0",
    "openbox-langchain-sdk-python>=0.1.0",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "langchain-core>=1.3.3",
    "langgraph>=0.2.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-instrumentation-requests>=0.41b0",
    "opentelemetry-instrumentation-httpx>=0.41b0",
    "opentelemetry-instrumentation-urllib3>=0.41b0",
    "opentelemetry-instrumentation-urllib>=0.41b0",
    "opentelemetry-instrumentation-sqlite3>=0.41b0",
    "opentelemetry-instrumentation-psycopg2>=0.41b0",
    "opentelemetry-instrumentation-asyncpg>=0.41b0",
    "opentelemetry-instrumentation-mysql>=0.41b0",
    "opentelemetry-instrumentation-pymysql>=0.41b0",
    "opentelemetry-instrumentation-pymongo>=0.41b0",
    "opentelemetry-instrumentation-redis>=0.41b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.41b0",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-instrumentation-requests>=0.41b0",
    "opentelemetry-instrumentation-httpx>=0.41b0",
    "opentelemetry-instrumentation-urllib3>=0.41b0",
    "opentelemetry-instrumentation-urllib>=0.41b0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0", 
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[tool.uv.sources]
# Base SDK has no published release yet; develop against the sibling checkout.
# Phase-independent: swapped for a published constraint at release time.
openbox-sdk-python = { path = "../openbox-sdk-python", editable = true }
# Pure LangChain-Core callback adapter (base package only — no `[agent]`
# extra, which pulls in `langchain` and this repo has no need of it). Develop
# against the sibling checkout until it has a published release; both repos
# pin the SAME editable ../openbox-sdk-python base dep above.
openbox-langchain-sdk-python = { path = "../openbox-langchain-sdk-python", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["openbox_langgraph"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# importlib mode isolates test-module resolution from sys.path. Required once
# the editable openbox-langchain-sdk-python sibling is installed: its own
# top-level `tests` package would otherwise shadow this repo's un-packaged
# `tests/` dir (e.g. `tests.golden`) and break collection under prepend mode.
addopts = "--import-mode=importlib"

[tool.coverage.run]
omit = [
    "openbox_langgraph/db_governance_hooks.py",
    "openbox_langgraph/file_governance_hooks.py",
    "openbox_langgraph/http_governance_hooks.py",
    "openbox_langgraph/otel_setup.py",
    "openbox_langgraph/tracing.py",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PIE", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
# openbox_langchain ships no py.typed marker yet — sibling dependency
# consumed as an editable path, not a type-stub gap in THIS repo's own code.
# `ignore_missing_imports` alone does not suppress mypy's `import-untyped`
# code for an editable install with no py.typed marker (only `import-not-found`) —
# `disable_error_code` is required to actually silence it here.
module = ["openbox_langchain", "openbox_langchain.*"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
